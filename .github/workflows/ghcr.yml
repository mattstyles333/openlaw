name: ghcr

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Publishes ghcr.io/mattstyles333/openlaw-mcp:<semver> with a leading v
# stripped from the git tag (v0.1.0 → 0.1.0).
# Live Portainer compose still pins ghcr.io/mattstyles333/canon-mcp:0.1.0.
# Do not put tokens in labels.

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/mattstyles333/openlaw-mcp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{raw}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
