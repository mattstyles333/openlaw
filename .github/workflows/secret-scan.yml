name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

# Run the gitleaks *container*, not gitleaks-action, so public forks do
# not need GITLEAKS_LICENSE.
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        run: docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.24.2 detect --source /repo --verbose --config /repo/.gitleaks.toml
