# Canon gitleaks config.
# Docs may mention token *names* (bearer, CANON_MCP_TOKEN). Values must still fail.
title = "Canon"

[extend]
useDefault = true

[[allowlists]]
description = "Environment variable NAMES used by optional MCP (not values)"
regexes = [
  '''CANON_MCP_TOKEN''',
  '''CANON_COMMIT_TOKEN''',
  '''GITHUB_TOKEN''',
]

[[allowlists]]
description = "Words 'bearer' and 'token' in markdown and CI are documentation, not secrets"
paths = [
  '''(?i)\.md$''',
  '''(?i)\.yml$''',
  '''(?i)\.yaml$''',
  '''(?i)\.toml$''',
  '''(?i)\.sh$''',
  '''(?i)\.mdc$''',
]
regexes = [
  '''(?i)\bbearer\b''',
  '''(?i)\btoken\b''',
]
