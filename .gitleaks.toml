# Openlaw gitleaks config.
# Docs may mention token *names* (bearer, OPENLAW_MCP_TOKEN). Values must still fail.
# Do not globally allowlist env var names — that would hide OPENLAW_MCP_TOKEN=<secret>.
title = "Openlaw"

[extend]
useDefault = true

[[allowlists]]
description = "Env var NAMES in docs, CI, compose, and the MCP module (not live values)"
paths = [
  '''(?:^|/)(\.gitleaks\.toml)$''',
  '''(?:^|/)(\.gitlab-ci\.yml)$''',
  '''(?:^|/)\.github/workflows/.*''',
  '''(?:^|/)docker-compose\.yml$''',
  '''(?:^|/)scripts/.*''',
  '''(?:^|/)mcp/(server\.py|README\.md|tests/.*)$''',
  '''(?:^|/)(README|SECURITY|CONTRIBUTING)\.md$''',
  '''(?:^|/)docs/.*\.md$''',
  '''(?:^|/)examples/.*\.md$''',
]
regexes = [
  '''OPENLAW_MCP_TOKEN''',
  '''OPENLAW_COMMIT_TOKEN''',
  '''CANON_MCP_TOKEN''',
  '''CANON_COMMIT_TOKEN''',
  '''GITHUB_TOKEN''',
]

[[allowlists]]
description = "Words 'bearer' and 'token' in markdown/CI are documentation, not secrets"
paths = [
  '''(?i)\.md$''',
  '''(?i)\.yml$''',
  '''(?i)\.yaml$''',
  '''(?i)\.toml$''',
  '''(?i)\.sh$''',
  '''(?i)\.mdc$''',
]
regexes = [
  '''(?i)\bbearer\b''',
  '''(?i)\btoken\b''',
]
