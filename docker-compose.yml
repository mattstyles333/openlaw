# Openlaw optional MCP — Portainer stack file (stack name: openlaw-mcp).
#
# Git is the source of truth. This container is a projection of git, not law.
# Prefer OPENLAW_MCP_TOKEN. CANON_MCP_TOKEN is a deprecated alias so existing
# Portainer env keeps working. Never commit a token. Never paste it here.
#
# Live image pin (do not delete this pass): ghcr.io/mattstyles333/canon-mcp:0.1.0
# Planned image name: ghcr.io/mattstyles333/openlaw-mcp
# Git tag v0.1.0 published the live pin. Compose still pins :0.1.0.
#
# Postgres is reserved/unimplemented in v0.1 and is not shipped here.

services:
  mcp:
    image: ghcr.io/mattstyles333/canon-mcp:0.1.0
    ports:
      - "8787:8787"
    environment:
      OPENLAW_MCP_TOKEN: ${OPENLAW_MCP_TOKEN:-}
      CANON_MCP_TOKEN: ${CANON_MCP_TOKEN:?OPENLAW_MCP_TOKEN or CANON_MCP_TOKEN is required}
      OPENLAW_COMMIT_TOKEN: ${OPENLAW_COMMIT_TOKEN:-}
      CANON_COMMIT_TOKEN: ${CANON_COMMIT_TOKEN:-}
    restart: unless-stopped
