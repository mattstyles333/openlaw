# Canon optional MCP — Portainer stack file (stack name: canon-mcp).
#
# Git is the source of truth. This container is a projection of git, not law.
# Set CANON_MCP_TOKEN in the environment or in the Portainer stack env UI.
# Never commit the token. Never paste it into this file.
#
# Image pin (compose / Portainer): ghcr.io/mattstyles333/canon-mcp:0.1.0
# Git tag v0.1.0 publishes that stripped semver. An extra :v0.1.0 tag may
# also exist; pin compose to :0.1.0.
#
# Postgres is reserved/unimplemented in v0.1 and is not shipped here.

services:
  mcp:
    image: ghcr.io/mattstyles333/canon-mcp:0.1.0
    ports:
      - "8787:8787"
    environment:
      CANON_MCP_TOKEN: ${CANON_MCP_TOKEN:?CANON_MCP_TOKEN is required}
      CANON_COMMIT_TOKEN: ${CANON_COMMIT_TOKEN:-}
    restart: unless-stopped
