# AlwaysLaw optional MCP. Git is the source of truth; this is a projection.
# Default: only the mcp service. Postgres is a profile and stays off.
#
# LAW_MCP_TOKEN is required (no fallback secret). The server refuses to
# listen if it is unset:
#   export LAW_MCP_TOKEN=...
#   docker compose up mcp

services:
  mcp:
    image: python:3.12-slim
    working_dir: /repo/mcp
    volumes:
      - .:/repo
    ports:
      - "8787:8787"
    environment:
      LAW_MCP_TOKEN: ${LAW_MCP_TOKEN}
      LAW_COMMIT_TOKEN: ${LAW_COMMIT_TOKEN:-}
      # LAW_POSTGRES_URL is reserved, off by default, unimplemented in v0.1.
    command:
      - sh
      - -c
      - pip install --quiet -e /repo/mcp && python /repo/mcp/server.py --host 0.0.0.0 --port 8787

  postgres:
    profiles: ["postgres"]
    image: postgres:16
    environment:
      POSTGRES_USER: alwayslaw
      POSTGRES_DB: alwayslaw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    # Optional. Not started by `docker compose up`.
    # v0.1 does not persist law to Postgres.
