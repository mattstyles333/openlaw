[project]
name = "canon-mcp"
version = "0.1.0"
description = "Optional thin HTTP MCP projection of Canon git markdown. Not the source of truth."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Canon contributors" }]
dependencies = [
  "starlette>=0.37,<1.6",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
]

[project.scripts]
canon-mcp = "server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
